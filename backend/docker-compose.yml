services:

  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"

  backend1:
    build: .
    environment:
      PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  backend2:
    build: .
    environment:
      PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  backend3:
    build: .
    environment:
      PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend1
      - backend2
      - backend3

  prometheus:
    image: prom/prometheus
    ports:
    - "9090:9090"
    volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend1
      - backend2
      - backend3
  
  grafana:
    image: grafana/grafana
    ports:
    - "3000:3000"